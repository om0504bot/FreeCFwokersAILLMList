name: Update Cloudflare Workers AI Free Models

on:
  schedule:
    # Daily at 21:00 UTC = 05:00 Taipei time (UTC+8)
    - cron: '0 21 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Needed to push to gh-pages
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper
        run: |
          python scrape_models.py

      - name: Commit updated docs to main
        run: |
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Cloudflare Workers AI models data ($(date +'%Y-%m-%d'))"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "chore: update Cloudflare Workers AI models comparison ($(date +'%Y-%m-%d'))"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: models-data
          path: docs/
          retention-days: 30